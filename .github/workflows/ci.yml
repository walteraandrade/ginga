name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes its older run pointless; on main every commit gets its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: engine (Rust 1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The engine's rust-version, from [workspace.package] in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.87
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine
          # Pull requests restore main's cache and save none, so they don't push it out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  adapter:
    name: gpui adapter (Rust 1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # ginga-gpui's rust-version: the oldest Rust that builds gpui-pre =0.3.12.
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: adapter
          # Pull requests restore main's cache and save none, so they don't push it out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p ginga-gpui --all-targets -- -D warnings
      - run: cargo test -p ginga-gpui
