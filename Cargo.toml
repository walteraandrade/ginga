[workspace]
resolver = "3"
members = ["crates/ginga", "crates/ginga-gpui"]
# The GPUI adapter takes minutes to build; plain `cargo test` covers the core only.
default-members = ["crates/ginga"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/walteraandrade/ginga"
categories = ["gui"]
# The oldest Rust the engine is checked with; CI runs on it.
rust-version = "1.87"

[workspace.dependencies]
# Keep `version` in step with [workspace.package] version.
ginga = { path = "crates/ginga", version = "0.1.0" }
# The GPUI snapshot that gpui-kit 0.9.1 builds on. An app must use the same one.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }

[workspace.lints.rust]
# The library forbids unsafe in its own source; one test needs it to count allocations.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Time, pixels and progress convert between f32 and f64 on purpose; the values are far from any type's limits.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# Tests assert exact values of closed-form motion on purpose.
float_cmp = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
