[package]
name = "ginga-gpui"
description = "ginga motion for GPUI views: the frame's clock, frame requests and reduced motion."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ginga = { path = "../ginga" }
# The GPUI snapshot that gpui-kit 0.9.1 builds on. An app must use the same one.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }

[lints]
workspace = true

# A real window for the island's measurement example: GPUI's platform, on X11.
# It builds on Linux only, and needs X11, Wayland, fontconfig and freetype's
# development packages there.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["x11", "font-kit"] }
