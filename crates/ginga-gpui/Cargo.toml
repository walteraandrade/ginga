[package]
name = "ginga-gpui"
description = "ginga motion for GPUI views: the frame's clock, frame requests and reduced motion."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
keywords = ["animation", "motion", "spring", "gpui", "ui"]
# The recording script runs the workspace's cargo, so it works only in the repository.
exclude = ["examples/gallery/record"]
# gpui-pre =0.3.12 uses library features stabilized in Rust 1.95.
rust-version = "1.95"

[dependencies]
ginga.workspace = true
# The pin is in the workspace's manifest, once for both uses.
gpui.workspace = true

[lints]
workspace = true

[dev-dependencies]
# GPUI's test platform: a clock the test moves and a simulated next frame, no display.
gpui = { workspace = true, features = ["test-support"] }

# A real window for the island's measurement example: GPUI's platform, on X11.
# It builds on Linux only, and needs X11, Wayland, fontconfig and freetype's
# development packages there.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["x11", "font-kit"] }

# The gallery's own tests, which play each page on GPUI's test platform, run
# with `cargo test -p ginga-gpui`.
[[example]]
name = "gallery"
test = true
